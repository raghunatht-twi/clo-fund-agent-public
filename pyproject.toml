[project]
name = "clo-funds"
version = "1.0.0"
description = "DKIG CLO Fund Performance Agent & REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn==0.46.0",
    "starlette==1.0.0",
    "pydantic==2.13.3",
    "pydantic_core==2.46.3",
    "annotated-types==0.7.0",
    "psycopg2-binary==2.9.12",
    "anthropic==0.98.1",
    "openpyxl==3.1.5",
    "cachetools==7.1.1",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "h11==0.16.0",
    "anyio==4.13.0",
    "sniffio==1.3.1",
    "click==8.3.3",
    "typing_extensions==4.15.0",
]

[project.scripts]
clo-db-agent  = "clo_db_agent.__main__:main"
clo-agent     = "clo_agent.__main__:main"
clo-api       = "clo_api.main:app"

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"db/load_ce_fund.py" = ["E501"]
"db/load_data.py" = ["E501"]
"db/load_tech_fund.py" = ["E501"]
"generate_data.py" = ["E501"]
